name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Lua 5.1
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.1

      # No npm dependencies. A fresh clone has no built data (it needs the game
      # client and local sources), so the tests that read it skip with a reason.
      - name: Test
        run: npm test

      # The textures are generated from code alone, so CI can rebuild them and
      # fail when the committed ones are stale.
      - name: Textures are up to date
        run: node tools/polestar.js media && git diff --exit-code -- addon/Polestar/Media
