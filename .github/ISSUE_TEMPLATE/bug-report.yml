name: Bug report
description: A Lua error, or something in Polestar that does not work.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: error
    attributes:
      label: Lua error
      description: Type `/console scriptErrors 1`, make the error happen again and paste the whole error text.
      render: text
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, what you expected and what happened.
      placeholder: |
        1. Open the guide menu
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Polestar version
      description: Shown at the foot of the Options sidebar and in the game's AddOns list.
    validations:
      required: true
  - type: textarea
    id: addons
    attributes:
      label: Other addons
      description: The other addons you have turned on.
